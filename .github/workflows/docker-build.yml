name: Validate and build Track 4 v2
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack reviewed source bundle
        run: unzip -q agenthon-source.zip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check output schema and evidence offsets
        run: |
          python -m pip install jsonschema==4.25.1 pytest==8.3.5 numpy==2.2.6 scipy==1.15.3
          python agenthon/tests/check_candidate.py
          python -m pytest agenthon/tests/test_v2.py -q
      - name: Build Linux image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/deltanlp-agenthon-track4:${GITHUB_SHA}"
          docker build --platform linux/amd64 -t "$IMAGE" agenthon
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Container smoke check under restricted settings
        run: |
          mkdir -p container-output
          chmod 777 container-output
          docker run --rm --network none --read-only --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --tmpfs /tmp:rw,noexec,nosuid,size=64m -v "$PWD/agenthon/source/track4-analysis-public-main/units/t4-EXAMPLE-eps-beat:/input:ro" -v "$PWD/container-output:/output" "$IMAGE" analyze --task /input/task.json --corpus /input/corpus --out /output/answer.json --offline
          test -s container-output/answer.json
          docker run --rm --network none --read-only --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --tmpfs /tmp:rw,noexec,nosuid,size=64m --entrypoint python "$IMAGE" -c 'import sys; sys.path.insert(0,"/app/agent"); from analyze_v2 import safe_program; r=safe_program("import json,sys\nfrom numerics import series_forecast\nd=json.load(sys.stdin)\nr=series_forecast([2,2,2,2,2,2])\nr[\"entity_id\"]=d[\"task\"][\"entities\"][0][\"entity_id\"]\nprint(json.dumps({\"predictions\":[r]}))", {"task":{"entities":[{"entity_id":"synthetic"}]}}); assert r["synthetic"]["point_forecast"]==2; print("Numerical child works under restricted container")'
      - name: Publish image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" > image-digest.txt
          cat image-digest.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Verify anonymous pull of exact published image
        run: |
          DIGEST=$(cat image-digest.txt)
          mkdir -p /tmp/anonymous-docker
          DOCKER_CONFIG=/tmp/anonymous-docker docker pull "$DIGEST"
          DOCKER_CONFIG=/tmp/anonymous-docker docker image inspect "$DIGEST" --format '{{.Architecture}} {{index .Config.Labels "qfbench2.interface_version"}}'
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-and-smoke-output
          path: |
            image-digest.txt
            container-output/answer.json
